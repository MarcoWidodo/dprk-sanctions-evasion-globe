<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DPRK Evasion Globe</title>
<meta name="description" content="An interactive investigation of North Korea's sanctions-evasion network: 3,956 actors, 6,502 documented links, and how few were ever sanctioned.">
<meta name="theme-color" content="#05060f">
<meta property="og:type" content="website">
<meta property="og:title" content="North Korea's Sanctions-Evasion Network · A Global View">
<meta property="og:description" content="Explore 3,956 actors and 6,502 documented links from RAND/C4ADS data, and see how few were ever formally sanctioned.">
<meta property="og:url" content="https://dprk-sanctions.vercel.app/">
<meta property="og:image" content="https://dprk-sanctions.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="North Korea's Sanctions-Evasion Network · A Global View">
<meta name="twitter:description" content="Explore 3,956 actors and 6,502 documented links, and see how few were ever formally sanctioned.">
<meta name="twitter:image" content="https://dprk-sanctions.vercel.app/og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230c1c30' stroke='%234c8dff' stroke-width='2'/%3E%3Cpath d='M5 13c7 4 15 4 22 0M5 19c7-4 15-4 22 0' stroke='%23f0642e' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- the single globe canvas; moved between the story stage and the explorer -->
<div id="globeViz"></div>

<!-- ============ STORY ============ -->
<div id="story">
  <nav class="st-nav">
    <div class="st-brand">North Korea's sanctions-evasion network</div>
    <div class="st-navbtns">
      <button class="btn ghost" id="storyAbout">About the data</button>
      <button class="btn primary" id="storySkip">Explore the data →</button>
    </div>
  </nav>
  <div class="st-stage" id="storyStage"></div>
  <div class="st-steps" id="steps"></div>
  <div class="st-progress" id="stProgress" aria-hidden="true"></div>
</div>

<!-- ============ EXPLORER ============ -->
<div id="explore" hidden>
  <header class="xh">
    <button class="btn ghost back" id="toStory" title="Back to the story">← Story</button>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" class="tab" data-view="globe" id="tab-globe" aria-controls="view-globe">Globe</button>
      <button role="tab" class="tab" data-view="countries" id="tab-countries" aria-controls="view-countries">Countries</button>
      <button role="tab" class="tab" data-view="targets" id="tab-targets" aria-controls="view-targets">Targets</button>
    </nav>
    <div class="xh-right">
      <div class="searchwrap">
        <input class="search" id="search" placeholder="Search actors: Chinpo, Office 39, Lazarus…" autocomplete="off" aria-label="Search actors">
        <div class="results" id="searchResults" hidden></div>
      </div>
      <button class="btn ghost icon" id="shareBtn" title="Copy a link to this exact view"><span aria-hidden="true">🔗</span><span class="lbl" id="shareLbl">Copy link</span></button>
      <button class="btn ghost icon" id="aboutBtn" title="About the data"><span class="q" aria-hidden="true">?</span><span class="lbl">About</span></button>
    </div>
  </header>

  <div class="fbar">
    <div class="pills" id="pills"></div>
    <div class="summary" id="summary"></div>
  </div>

  <div class="xmain">
    <div class="views">
      <section class="view" id="view-globe" role="tabpanel" aria-labelledby="tab-globe">
        <div id="exploreStage"></div>
        <div class="legend-card" id="legendCard">
          <button class="legend-toggle" id="legendToggle" aria-expanded="true">Legend</button>
          <div class="legend" id="legend"></div>
        </div>
        <div class="hint" id="globeHint">Drag to spin · click a country or search an actor</div>
      </section>
      <section class="view" id="view-countries" role="tabpanel" aria-labelledby="tab-countries" hidden></section>
      <section class="view" id="view-targets" role="tabpanel" aria-labelledby="tab-targets" hidden></section>
    </div>
    <aside id="inspector" hidden aria-live="polite">
      <div class="insp-head">
        <button class="backbtn" id="inspBack" hidden>← back</button>
        <button class="xbtn" id="inspClose" aria-label="Close details">×</button>
      </div>
      <div class="insp-body" id="inspBody"></div>
    </aside>
  </div>
</div>

<div class="pop" id="pop" hidden></div>

<div class="modal" id="aboutModal"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
  <div class="sheet-hd"><div><h2 id="aboutTitle">About this project</h2><div class="sub">How to read it, where the data comes from, and its limits</div></div><button class="xbtn" id="aboutClose" aria-label="Close">×</button></div>
  <div class="sheet-bd" id="aboutBody"></div>
</div></div>

<div id="load"><div class="spin"></div><p>Rendering globe…</p></div>

<script src="js/vendor/topojson-client-3.1.0.min.js"></script>
<script src="js/vendor/globe.gl-2.34.4.min.js"></script>
<script src="data/data.js"></script>
<script src="data/metrics.js"></script>
<script src="js/app.js"></script>
</body>
</html>
